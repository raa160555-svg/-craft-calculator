@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--fg:#e8e8e8;--card:#22262e;--line:#3a404c;--ac:#6ea0ff;--mu:#a0a6b2}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=search]{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}

.q{display:flex;align-items:center;gap:4px}
.q button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px}
.q input{width:44px;text-align:center;padding:5px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:16px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:12px 0}
.sum h2{font-size:16px;margin:0 0 6px}
.mat{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted var(--line)}
.tot{font-size:18px;font-weight:700;color:var(--ac)}
.note{color:var(--mu);font-size:12px}

function tabs(){$("tabs").innerHTML=cats.map(c=>`<button class="${c==cur?"on":""}" onclick="cur='${c}';tabs();draw()">${c}</button>`).join("")}
function draw(){const s=$("s").value.trim().toLowerCase();
$("list").innerHTML=D.filter(d=>s?d.n.toLowerCase().includes(s):d.c==cur).map(d=>`<div class="row"><div class="n">${d.n}<small>${d.p?f(d.p)+"円":"価格なし"} / ${Object.entries(d.mat).map(([k,v])=>k+v).join(" ")}</small></div><div class="q"><button onclick="ch(${d.id},-1)">−</button><input type="number" min="0" inputmode="numeric" id="q${d.id}" value="${Q[d.id]||0}" onchange="set(${d.id},this.value)"><button onclick="ch(${d.id},1)">＋</button></div></div>`).join("")}
function ch(i,x){set(i,(Q[i]||0)+x)}
function set(i,v){Q[i]=Math.max(0,parseInt(v)||0);const e=$("q"+i);if(e)e.value=Q[i];calc()}
function clr(){for(const k in Q)delete Q[k];draw();calc()}
function calc(){const m={};let p=0,np=[];D.forEach(d=>{const q=Q[d.id]||0;if(!q)return;for(const k in d.mat)m[k]=(m[k]||0)+d.mat[k]*q;if(d.p)p+=d.p*q;else np.push(d.n)});
const e=Object.entries(m);$("mats").innerHTML=e.length?e.map(([k,v])=>`<div class="mat"><span>${k}</span><b>${f(v)}</b></div>`).join(""):"作りたい数を入力してください";
$("price").textContent=f(p)+"円";$("np").textContent=np.length?"価格なしのため除外: "+np.join("、"):""}
